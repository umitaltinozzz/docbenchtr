[project]
name = "docbenchtr"
version = "0.1.0"
description = "A reproducible pilot benchmark for retrieval on structured Turkish legal documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ümit Altınöz" }]
dependencies = [
  "numpy==2.2.6",
  "rank-bm25==0.2.2",
  "sentence-transformers==5.4.1",
  "transformers==4.56.2",
  "huggingface-hub[hf-xet]==0.36.2",
  "torch==2.7.1+cu126",
  "snowballstemmer==3.0.1",
  "matplotlib==3.10.3",
  "pageindex==0.4.0",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
